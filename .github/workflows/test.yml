name: Test

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Pin ubuntu to avoid ubuntu-latest → 26 migration notices (Oct 2026).
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        shell: bash
        run: go build -o dstp$(go env GOEXE) ./cmd/dstp

      - name: Unit tests
        shell: bash
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage floor
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/{print substr($3,1,length($3)-1)}')
          echo "total coverage: ${total}%"
          # Ratchet: fail if overall coverage drops below this floor.
          awk -v t="$total" 'BEGIN{ if ((t+0) < 40.0) { print "coverage " t "% below floor 40%"; exit 1 } }'

      - name: Race tests
        if: runner.os == 'Linux'
        shell: bash
        run: go test -race ./...

      - name: Integration tests
        if: runner.os != 'Windows'
        shell: bash
        env:
          CI: true
        run: go test -v -tags=integration ./pkg/dstp ./pkg/lookup

      # Coverage floor above is the required gate. Codecov needs CODECOV_TOKEN;
      # without it the uploader errors, so do not fail the job.
      - name: Upload coverage
        if: matrix.os == 'ubuntu-24.04'
        continue-on-error: true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  goreleaser-snapshot:
    name: Release snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Snapshot
        # Install binary via action (avoid `go run @latest`, which may require a newer Go
        # than go.mod's toolchain). Skip SBOM/sign/publish for smoke builds.
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2.12"
          args: release --snapshot --clean --skip=publish,sign,sbom
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
