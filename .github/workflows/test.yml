name: Test

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25.x"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Test
        timeout-minutes: 5
        run: |
          go build -o dstp ./cmd/dstp
          go test -v ./...
          go test -v -tags=integration ./...
