name: Test

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        shell: bash
        run: go build -o dstp$(go env GOEXE) ./cmd/dstp

      - name: Unit tests
        shell: bash
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Race tests
        if: runner.os == 'Linux'
        shell: bash
        run: go test -race ./...

      - name: Integration tests
        if: runner.os != 'Windows'
        shell: bash
        env:
          CI: true
        run: go test -v -tags=integration ./pkg/dstp ./pkg/lookup

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          fail_ci_if_error: false

  goreleaser-snapshot:
    name: Release snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Snapshot
        run: go run github.com/goreleaser/goreleaser/v2@latest release --snapshot --clean --skip=publish
