name: Test

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.6"]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        shell: bash
        run: go build -o dstp$(go env GOEXE) ./cmd/dstp

      - name: Unit tests
        shell: bash
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Integration tests
        if: runner.os != 'Windows'
        shell: bash
        env:
          CI: true
        run: go test -v -tags=integration ./pkg/dstp ./pkg/lookup

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.out
          fail_ci_if_error: false
