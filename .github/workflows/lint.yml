name: Lint

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

jobs:
  go-lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      # Built with the runner's Go (must be >= go.mod). Avoids release-binary
      # toolchain mismatches that make golangci-lint-action exit 3.
      - name: Run golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run --timeout=5m ./...
