name: Lint

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

jobs:
  go-lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Binary must be built with Go >= module go directive (1.26.6).
          version: v2.12.2
          args: --timeout=5m
