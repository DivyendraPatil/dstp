version: "2"

linters:
  default: standard
  enable:
    - gosec
    - gocyclo
    - unconvert
  settings:
    gocyclo:
      min-complexity: 45
    gosec:
      excludes:
        - G204 # intentional fixed argv for ping/traceroute/whois (see SECURITY.md)
        - G304 # config path is user-provided by design
        - G402 # only with explicit --insecure
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters: [errcheck]
        path: _test\.go
        text: Error return value of
      - linters: [gosec]
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
      - tools$
